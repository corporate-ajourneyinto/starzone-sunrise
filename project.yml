name: starzone
options:
  bundleIdPrefix: ch.starzone
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de

targets:
  starzone:
    type: application
    platform: iOS
    sources:
      - path: starzone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sunrisestarzoneappv1
        INFOPLIST_FILE: starzone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
