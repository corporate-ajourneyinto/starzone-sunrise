name: App Store Connect Upload (iOS)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (leer lassen für Standard / Repo-Variable APP_BUNDLE_ID)"
        required: false
        default: ""
      marketing_version:
        description: "App-Version (CFBundleShortVersionString)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Build-Nummer (leer lassen für automatische GitHub Run-Nummer)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  upload-app-store:
    name: Build, Sign & Upload to App Store Connect
    runs-on: macos-15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Erforderliche Secrets prüfen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=0
          for var in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Fehlendes GitHub Secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Bitte lege unter Settings -> Secrets and variables -> Actions die Secrets APPLE_TEAM_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID und APP_STORE_CONNECT_API_KEY an."
            exit 1
          fi

      - name: Build-Parameter bestimmen
        env:
          INPUT_BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
          VAR_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          INPUT_VERSION: ${{ github.event.inputs.marketing_version }}
          INPUT_BUILD: ${{ github.event.inputs.build_number }}
        run: |
          BUNDLE_ID="${INPUT_BUNDLE_ID:-${VAR_BUNDLE_ID:-sunrisestarzoneappv1}}"
          MARKETING_VERSION="${INPUT_VERSION:-1.0.0}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MARKETING_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          BUILD_NUMBER="${INPUT_BUILD:-${GITHUB_RUN_NUMBER}}"

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version:   $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: App Store Connect API-Key (.p8) vorbereiten
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          if [[ "$ASC_API_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY" | base64 --decode > "$KEY_PATH"
          fi

          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_API_KEY ist keine gültige .p8-Datei (weder Klartext-PEM noch Base64)."
            exit 1
          fi
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: iOS-App archivieren (Release)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project starzone.xcodeproj \
            -scheme starzone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/starzone.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive | tee "$RUNNER_TEMP/archive.log"

      - name: ExportOptions.plist erzeugen (Apple Cloud Signing)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :destination string upload" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$PLIST"
          plutil -lint "$PLIST"

      - name: Signieren & direkt zu App Store Connect (TestFlight) hochladen
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/starzone.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export-upload.log"

      - name: Temporären API-Key entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

      - name: Build-Logs bei Fehler als Artefakt sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export-upload.log
          if-no-files-found: ignore
